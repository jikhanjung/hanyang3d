{% load i18n_ko %}<div id="scene-loading" role="status" aria-live="polite"><span id="loading-message">{% tblock %}3D 화면을 준비하는 중입니다{% endtblock %}</span><progress id="loading-progress" max="{{ loading_steps|default:8 }}" value="0" aria-label="{% t '화면 준비 단계' %}"></progress><small>{% tblock %}준비된 요소부터 표시합니다 · 지형이 보이면 드래그로 둘러볼 수 있습니다{% endtblock %}</small><button id="loading-retry" hidden onclick="location.reload()">{% tblock %}다시 불러오기{% endtblock %}</button></div>
