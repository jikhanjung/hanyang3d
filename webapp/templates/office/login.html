<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>도성도감 · 로그인</title>
<style>body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f8f5ee;color:#1f2a24;display:grid;place-items:center;min-height:100vh}form{background:#fff;border:1px solid #d9d4c7;border-radius:8px;padding:20px 22px;width:min(340px,92vw);display:grid;gap:10px}label{display:grid;gap:3px}input{padding:6px 8px;border:1px solid #d9d4c7;border-radius:4px;font:inherit}button{padding:7px;border:none;border-radius:4px;background:#1f5f52;color:#fff;font:inherit}.err{color:#9a4a1f;margin:0}</style></head>
<body><form method="post"><strong>도성도감 <small style="font-weight:400;color:#5f6d66">都城都監 · 관원 출입</small></strong>{% csrf_token %}
{% if form.errors %}<p class="err">이름이나 비밀번호가 맞지 않습니다.</p>{% endif %}
<label>관리자 이름<input name="username" autocomplete="username" autofocus required></label>
<label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
<input type="hidden" name="next" value="{{ next }}"><button type="submit">들어가기</button>
<small>관원(운영진) 계정만 들어올 수 있습니다. 플레이어 계정과는 다릅니다.</small></form></body></html>
