{% load i18n_ko %}<button id="map-options-toggle" aria-label="{% t '설정' %}" title="{% t '설정' %}" aria-expanded="false" aria-controls="map-options"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
<strong class="map-title">{% tblock %}한양3D{% endtblock %}<small>{{ app_version }} · {% t '1750년경' %}</small></strong>
<div id="map-options">
<button id="walk-together" aria-pressed="false">{% tblock %}1인칭{% endtblock %}</button>
<label class="map-opacity">{% t "옛지도" %} <input id="opacity3d" aria-label="{% t '옛 지도 불투명도' %}" type="range" min="0" max="100" value="50"> <output id="opacity-value">50%</output></label>
{% if canvas_only %}{% include "terrain3d_layers.html" %}{% endif %}
<label hidden><input id="anchors3d" type="checkbox">{% tblock %}보정점{% endtblock %}</label>
<button id="about-open" type="button" aria-haspopup="dialog" aria-controls="about-panel">About</button>
<span class="lang-switch" role="group" aria-label="{% t '언어' %}"><a href="?lang=ko" hreflang="ko"{% if lang == "ko" %} aria-current="true"{% endif %}>KO</a> | <a href="?lang=en" hreflang="en"{% if lang == "en" %} aria-current="true"{% endif %}>EN</a></span>
</div>
