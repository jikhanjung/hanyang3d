<button id="map-options-toggle" aria-expanded="false" aria-controls="map-options">설정</button>
<strong class="map-title">한양3D <small>{{ app_version }}</small></strong>
<div id="map-options">
<button id="first-person3d" aria-pressed="false">1인칭으로 걷기</button>
<label class="map-opacity">옛지도 <input id="opacity3d" aria-label="옛 지도 불투명도" type="range" min="0" max="100" value="50"> <output id="opacity-value">50%</output></label>
{% if canvas_only %}{% include "terrain3d_layers.html" %}{% endif %}
<label hidden><input id="anchors3d" type="checkbox">보정점</label>
</div>
