# Request limits (per client IP). Matchmaking creates or reserves rooms, so it is limited strictly;
# the login form is limited against password guessing.
limit_req_zone $binary_remote_addr zone=hanyang3d_matchmake:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=hanyang3d_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=hanyang3d_walk:10m;

server {
    listen 80;
    listen [::]:80;
    server_name hanyang3d.nopeoplestime.info;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/hanyang3d/acme;
    }
    location / {
        return 301 https://hanyang3d.nopeoplestime.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hanyang3d.nopeoplestime.info;
    ssl_certificate /etc/letsencrypt/live/hanyang3d.nopeoplestime.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanyang3d.nopeoplestime.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /srv/hanyang3d;
        internal;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /multiplayer/matchmake/ {
        limit_req zone=hanyang3d_matchmake burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8015/matchmake/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /multiplayer/ {
        limit_conn hanyang3d_walk 8;
        proxy_pass http://127.0.0.1:8015/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /backoffice/login/ {
        limit_req zone=hanyang3d_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
