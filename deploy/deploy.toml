contract_version = 1
instance = "hanyang3d"
image = "honestjung/hanyang3d"
version = "v0.5.42"
platform = "linux/amd64"
settings = "webapp.settings"
has_database = true
health_url = "/healthz"
services = ["hanyang3d", "multiplayer"]
multiplayer_image = "honestjung/hanyang3d-multiplayer"
multiplayer_version = "v0.5.31"

[verbs]
build = "bash deploy/build.sh v0.5.42 --web-only"
deploy = "bash /srv/hanyang3d/deploy.sh v0.5.42 v0.5.31"
rollback = "bash /srv/hanyang3d/deploy.sh <previous-version>"

[targets.prod]
host = "dolfinid"
ssh_user = "honestjung"
hostname = "cdgts.paleobytes.info"
domain = "hanyang3d.nopeoplestime.info"
root = "/srv/hanyang3d"
expose = "127.0.0.1:8013"
multiplayer_expose = "127.0.0.1:8015"
data = "/srv/hanyang3d/data/<version>"
# Host nginx/TLS configuration: deploy/host/hanyang3d.nginx.conf.
